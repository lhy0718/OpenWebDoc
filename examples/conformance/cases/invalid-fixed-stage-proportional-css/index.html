<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Invalid Fixed Stage Proportional CSS</title>
    <link rel="stylesheet" href="styles/document.css" />
  </head>
  <body>
    <main
      data-htmlx-block-id="stage"
      data-htmlx-editable="document"
      data-htmlx-stage-width="980"
      data-htmlx-stage-height="620"
    >
      <h1
        data-htmlx-block-id="title"
        data-htmlx-kind="heading"
        data-htmlx-editable="text"
        data-htmlx-x="40"
        data-htmlx-y="40"
        data-htmlx-width="700"
        data-htmlx-font-size="36"
        data-htmlx-line-height="1.1"
      >
        Fixed-stage packages cannot use viewport-driven CSS functions.
      </h1>
    </main>
  </body>
</html>
