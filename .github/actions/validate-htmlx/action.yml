name: Validate HTMLX packages
description: Validate HTMLX Document Package files with the OpenWebDoc htmlx CLI.

inputs:
  paths:
    description: Newline-separated glob patterns for .htmlx files to validate.
    required: false
    default: "**/*.htmlx"
  fail-on-empty:
    description: Fail when no files match the provided patterns.
    required: false
    default: "true"
  summary:
    description: Write a short validation summary to the GitHub Actions job summary.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - name: Build htmlx CLI
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH/../../.."
        pnpm install --frozen-lockfile
        pnpm --filter @openwebdoc/spec build
        pnpm --filter @openwebdoc/core build
        pnpm --filter @openwebdoc/cli build

    - name: Validate packages
      shell: bash
      run: |
        set -uo pipefail
        shopt -s globstar nullglob

        cli="$GITHUB_ACTION_PATH/../../../packages/cli/dist/index.js"
        found=0
        checked=0
        failed=0

        cd "$GITHUB_WORKSPACE"
        while IFS= read -r pattern; do
          [ -z "$pattern" ] && continue
          for file in $pattern; do
            if [ -f "$file" ]; then
              found=1
              checked=$((checked + 1))
              echo "::group::htmlx validate $file"
              if node "$cli" validate "$file" --json; then
                echo "::endgroup::"
              else
                echo "::endgroup::"
                failed=1
              fi
            fi
          done
        done <<< "${{ inputs.paths }}"

        if [ "$found" -eq 0 ] && [ "${{ inputs.fail-on-empty }}" = "true" ]; then
          echo "No HTMLX packages matched the provided paths."
          exit 1
        fi

        if [ "${{ inputs.summary }}" = "true" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          {
            echo "### Agentic Document Integrity"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| HTMLX packages checked | $checked |"
            if [ "$failed" -eq 0 ]; then
              echo "| Package validation | Pass |"
            else
              echo "| Package validation | Fail |"
            fi
            echo
            echo "Validation was performed with the OpenWebDoc htmlx CLI. Package metadata is treated as user-visible reference data, not as an instruction channel."
          } >> "$GITHUB_STEP_SUMMARY"
        fi

        if [ "$failed" -ne 0 ]; then
          exit 1
        fi
