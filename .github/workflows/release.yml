name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release check
        run: pnpm release:check

      - name: Create spec and docs snapshot
        run: |
          mkdir -p dist/release
          tar -czf "dist/release/openwebdoc-spec-docs-${GITHUB_REF_NAME}.tar.gz" \
            README.md \
            docs \
            examples/README.md \
            packages/spec/src \
            packages/spec/fixtures

      - name: Stage valid example packages
        run: |
          mkdir -p dist/release/examples
          for package in examples/*.htmlx; do
            if [ "$(basename "$package")" = "security-invalid.htmlx" ]; then
              continue
            fi
            cp "$package" dist/release/examples/
          done

      - name: Check release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: test -f "docs/releases/${GITHUB_REF_NAME}.md"

      - name: Upload npm tarballs
        uses: actions/upload-artifact@v7
        with:
          name: npm-packages
          path: dist/npm/*.tgz

      - name: Upload static site
        uses: actions/upload-artifact@v7
        with:
          name: static-site
          path: dist/site

      - name: Upload spec and docs snapshot
        uses: actions/upload-artifact@v7
        with:
          name: spec-docs-snapshot
          path: dist/release/*.tar.gz

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md" \
            --prerelease \
            dist/npm/*.tgz \
            dist/release/examples/*.htmlx \
            dist/site/manifest.json \
            dist/release/*.tar.gz
